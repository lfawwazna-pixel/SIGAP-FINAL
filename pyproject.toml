[project]
name = "sigap-foundation"
version = "0.1.0"
description = "SIGAP lokal, tahap 2E/2F: kendaraan dan percobaan terpisah dengan prioritas darurat"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.1.2",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "imageio-ffmpeg==0.6.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "postgres: membutuhkan database PostgreSQL pengujian khusus",
  "process: menjalankan proses ATCS/backend lokal pada port pengujian sementara",
]
